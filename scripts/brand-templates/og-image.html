<!doctype html>
<!-- Rendered by scripts/build-brand.py: {{base}} is the current og-image.png,
     {{logo}} is src/assets/brand/logo-white.svg. Only the logo area changes. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: url("{{base}}") 0 0 / 1200px 630px no-repeat; }
  /* Clears the previous logo; the headline starts below y = 200. */
  .patch { position: absolute; left: 70px; top: 70px; width: 600px; height: 120px; background: #078844; }
  svg { position: absolute; left: {{left}}px; top: {{top}}px; width: auto; height: {{height}}px; }
</style>
<div class="patch"></div>
{{logo}}
